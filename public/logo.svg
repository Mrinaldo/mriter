<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Background Squircle: Rich Slate Charcoal Obsidian with subtle warm gradient -->
      <rect width="512" height="512" rx="112" fill="url(#bg-gradient)" />
      
      <!-- Inner subtle border ring for macOS elegance -->
      <rect x="8" y="8" width="496" height="496" rx="104" stroke="url(#border-sheen)" stroke-width="2" fill="none" />

      <!-- Drop shadow filter -->
      <filter id="shadow" x="50" y="70" width="412" height="360" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.5" />
      </filter>

      <g filter="url(#shadow)">
        <!-- GOLDEN SILK RIBBON TOP ANCHOR (Emerging from spine behind pages) -->
        <path d="M 242 110 L 270 110 L 270 180 L 242 180 Z" fill="#8c5f1c" />

        <!-- LEFT FOLIO (Drafting Wing) -->
        <path d="M 104 380 L 104 186 C 104 136 136 112 182 112 C 220 112 248 140 256 208 L 256 364 C 248 320 220 298 182 298 C 136 298 104 326 104 380 Z" 
              fill="url(#left-front-page)" />
        
        <!-- Left Inner Page Valley Plane -->
        <path d="M 182 112 C 220 112 248 140 256 208 L 256 364 C 248 320 220 298 182 298 L 182 112 Z" 
              fill="url(#left-inner-fold)" opacity="0.9" />

        <!-- RIGHT FOLIO (Publishing Wing) -->
        <path d="M 408 380 L 408 186 C 408 136 376 112 330 112 C 292 112 264 140 256 208 L 256 364 C 264 320 292 298 330 298 C 376 298 408 326 408 380 Z" 
              fill="url(#right-front-page)" />
        
        <!-- Right Inner Page Valley Plane -->
        <path d="M 330 112 C 292 112 264 140 256 208 L 256 364 C 264 320 292 298 330 298 L 330 112 Z" 
              fill="url(#right-inner-fold)" opacity="0.95" />

        <!-- Delicate Spine Contour -->
        <path d="M 104 380 L 104 186 C 104 136 136 112 182 112 C 220 112 248 140 256 208 C 264 140 292 112 330 112 C 376 112 408 136 408 186 L 408 380" 
              stroke="#cfc5b4" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.65" />

        <!-- GOLDEN SILK RIBBON BOOKMARK (Main body) -->
        <path d="M 242 160 L 270 160 L 270 324 L 256 306 L 242 324 Z" 
              fill="url(#gold-ribbon)" />
        <!-- Ribbon top fold specular highlight -->
        <path d="M 242 160 L 270 160 L 270 172 L 242 172 Z" 
              fill="#ffe49e" opacity="0.9" />
        <!-- Ribbon center crease fold -->
        <line x1="256" y1="160" x2="256" y2="306" stroke="#805414" stroke-width="1.8" opacity="0.7" />
      </g>

      <defs>
        <linearGradient id="bg-gradient" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#2c2825" />
          <stop offset="50%" stop-color="#201e1d" />
          <stop offset="100%" stop-color="#141312" />
        </linearGradient>

        <linearGradient id="border-sheen" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
          <stop offset="45%" stop-color="#ffffff" stop-opacity="0.05" />
          <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
        </linearGradient>

        <linearGradient id="left-front-page" x1="104" y1="112" x2="256" y2="380" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="55%" stop-color="#f6f1e8" />
          <stop offset="100%" stop-color="#ded2bf" />
        </linearGradient>

        <linearGradient id="left-inner-fold" x1="182" y1="112" x2="256" y2="364" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#ece2d0" />
          <stop offset="100%" stop-color="#b2a48f" />
        </linearGradient>

        <linearGradient id="right-front-page" x1="408" y1="112" x2="256" y2="380" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#faf4ea" />
          <stop offset="55%" stop-color="#ede2d0" />
          <stop offset="100%" stop-color="#c6b8a3" />
        </linearGradient>

        <linearGradient id="right-inner-fold" x1="330" y1="112" x2="256" y2="364" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#ded3bf" />
          <stop offset="100%" stop-color="#a4947d" />
        </linearGradient>

        <linearGradient id="gold-ribbon" x1="256" y1="160" x2="256" y2="324" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#ffdc82" />
          <stop offset="35%" stop-color="#d69f3c" />
          <stop offset="70%" stop-color="#af7820" />
          <stop offset="100%" stop-color="#7e5210" />
        </linearGradient>
      </defs>
    </svg>